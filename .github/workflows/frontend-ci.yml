name: Frontend CI

# Sin filtro de rama: una rama de feature como p10-6-hallazgos-degenerativos tiene que
# ver el CI antes del merge, no despues.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Las ~470 aserciones de scripts/*-tests.mjs. Los e2e de Playwright quedan fuera:
      # necesitan la app levantada y el backend detras.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # La imagen se construye siempre, tambien en un PR: un Dockerfile roto tiene que
  # aparecer antes del merge. Publicar solo ocurre en un push a main, y despues de lint,
  # typecheck, tests y build.
  image:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/enzoaa004/pfi-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Sin credenciales propias: GITHUB_TOKEN alcanza para GHCR del mismo owner.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No se pasa VITE_API_BASE_URL a proposito: el backend se configura en runtime con
      # BACKEND_URL, que docker/entrypoint.sh escribe en env.js y que gana sobre lo que
      # quedo compilado. Es lo que permite que esta misma imagen sirva en cualquier
      # entorno sin recompilar.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
