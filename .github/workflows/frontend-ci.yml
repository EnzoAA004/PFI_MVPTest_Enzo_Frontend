name: Frontend CI

# Sin filtro de rama: una rama de feature como p10-6-hallazgos-degenerativos tiene que
# ver el CI antes del merge, no despues.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Las ~470 aserciones de scripts/*-tests.mjs. Los e2e de Playwright quedan fuera:
      # necesitan la app levantada y el backend detras.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
