<!doctype html>
<!--
  El tema va en <html> y no en <body>: components.css arrastra un
  `:root { background: var(--bg-app) }` heredado, y `:root` es <html>. Con el
  atributo en <body>, ese fondo quedaba fuera del alcance del tema y el
  documento se seguía pintando con el claro por debajo de la aplicación.
-->
<html lang="es" data-theme="clinical">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>PFI MVP Frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
